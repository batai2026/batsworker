# --- dev toolchain only (never in the bundle) ---

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
# CVE-2026-112366, CVSS 8.7. Published 2026-10-19 but only surfaced here on
# 2026-11-17T15:56:42Z (github_reviewed_at), when GitHub promoted it to a reviewed
# advisory and OSV re-published it (modified=2026-11-17T16:00:03Z). That lands
# between the last green audit (15:23) and the red one (16:05), so this is an
# advisory-database change: no dependency moved.
effectiveUntil = 2027-08-01
reason = "picomatch ReDoS through single-branch repeated extglobs. Unfixable today: the advisory's last_affected is 4.0.7 and 4.0.7 IS the latest published version on npm (dist-tags.latest=4.0.7, newest publish 2026-08-24, no 4.0.8 in any channel), so there is no upgrade to take. Dev-only and not reachable from app input: every edge is in the vitest toolchain (surfaces/gui/package-lock.json: vite 8.3.8 and vitest 4.1.12 both pin picomatch 4.0.7, tinyglobby 0.2.17 rides 4.0.4, all dev), nothing here ships in the bundle, and the globs those tools evaluate are repo-controlled config patterns (include/exclude lists in vite.config), never attacker-supplied. Drop the entry when an upstream release moves off picomatch or picomatch ships a fix."
