# ---------------------------------------------------------------------------
# Tauri's own dependency tree — fixes require a Tauri/GTK major bump.
# ---------------------------------------------------------------------------
# Neither crate parses request or file input in this app: quick-xml is reached
# through Tauri's own metadata handling, glib through Tauri's Linux GTK layer.
# Their DoS classes need attacker-chosen XML/GTK input that never enters here.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"
effectiveUntil = 2027-03-01
reason = "quick-xml quadratic time on duplicate attributes. Reachable only via Tauri's own plist/metadata parsing, not from app input. A fix EXISTS (0.41.0) but is a breaking 0.x bump inside Tauri's tree: accepting a DoS to avoid forcing a Tauri major, not unfixable."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"
effectiveUntil = 2027-03-01
reason = "quick-xml unbounded namespace allocation in NsReader. Same Tauri-internal-only path. A fix EXISTS but is a breaking 0.x bump inside Tauri's tree: accepting a DoS, not declaring it unfixable."

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
effectiveUntil = 2027-03-01
reason = "glib VariantStrIter unsoundness. glib is Tauri's Linux GTK binding; this codebase never constructs a VariantStrIter. Fix is a breaking 0.18 -> 0.20 bump owned by Tauri."

