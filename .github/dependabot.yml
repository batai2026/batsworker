# Dependabot version updates.
#
# Why this file exists: every third-party action in .github/workflows/ is pinned to a
# full commit SHA (38 refs, pinned 2026-11). A SHA pin is only safe if something moves it
# forward -- otherwise the gate ages into a pile of unpatched action versions, which is
# its own supply-chain problem. Dependabot is that something, and it rewrites the `# vN`
# comment alongside the SHA so the pin stays readable.
#
# Scope note: this covers *version* updates. Vulnerability-driven upgrades stay on the
# osv-scanner gate in dependency-audit.yml, which knows this project's accept-list and
# reachability rules; turning those into Dependabot security PRs would swap that
# judgement for a severity-only view.
#
# Python: uv.lock is the source of truth; requirements-*.lock are `uv export`ed from
# it and are what CI installs. The pairing is now enforced, not assumed:
# scripts/check_lock_consistency.py re-runs each lockfile's recorded export against
# uv.lock on every PR, so a Dependabot PR that bumps a version must carry the paired
# re-export -- one without it turns the gate red instead of shipping a green CI with
# an unchanged runtime. Minor + patch are grouped; majors land as their own PR.

version: 2
updates:
  # Actions. Grouped into one PR per week: 38 individual PRs would be noise, and they
  # are all reviewed the same way (the diff is a SHA plus a version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Desktop shell (Tauri frontend).
  - package-ecosystem: "npm"
    directory: "/surfaces/gui"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  # Rust: the Tauri backend and the STT sidecar are separate crates with separate
  # lockfiles, so they need separate entries. Minor + patch only -- a major of a Tauri
  # or whisper binding changes behaviour this CI cannot see.
  - package-ecosystem: "cargo"
    directory: "/surfaces/gui/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/stt"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  # The published image (python:3.12-slim base).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  # The Python dependency graph (uv.lock at the repo root).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
