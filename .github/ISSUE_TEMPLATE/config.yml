blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/batai2026/batsworker/security/advisories/new
    about: |
      Report privately, never in a public issue. Private vulnerability reporting
      is the primary channel; SECURITY.md describes scope, supported versions
      and what to expect.
  - name: Question or usage help
    url: https://github.com/batai2026/batsworker/blob/main/docs/user-guide.md
    about: |
      The user manual covers setup, models, permissions and automations, and
      states which versions it applies to. If it does not answer the question,
      open a feature request with the "Other / not sure" area so it can be
      triaged as a docs gap.
  - name: Dependency advisory you found yourself
    url: https://github.com/batai2026/batsworker/blob/main/SECURITY.md
    about: |
      A vulnerable dependency that is reachable from this code is a security
      report — use the private channel. Unreachable/developer-only advisories are
      tracked in osv-scanner.toml and can be raised as a normal bug.
