# OSV-Scanner suppressions — accepted dependency risk, with deadlines.
#
# POLICY
#   * Only genuinely UNFIXABLE advisories belong in this file. Anything with a
#     released fix gets upgraded, not listed here.
#   * Every entry carries an `effectiveUntil` (not the deprecated `ignoreUntil`
#     alias). When the date passes, the finding reappears in CI: the acceptance
#     is debt with a due date, not silence.
#   * Every entry explains WHY it is safe here — the code path, not the CVSS.
#
# This file is passed explicitly (`--config=osv-scanner.toml`) because
# osv-scanner.toml does not propagate into subdirectories, and our lockfiles
# live in surfaces/gui/ and stt/.
#
# Audit that produced this list: 2026-11-08 (94 unique advisories over 4 sources).
#
# Of those 94, 72 are absent from this file because they were UPGRADED, not
# suppressed (all on 2026-11-09, each suite green):
#   * 34 closed by upgrade — pypdf 18, rustls/webpki 11, certifi 2 (reachable),
#     plus tokio/anyhow/event-listener 3 that fell out of the same Rust bump.
#   * 23 npm dev-toolchain advisories — vite, vitest, @vitest/mocker, tinypool,
#     esbuild, postcss, postcss-selector-parser, browserslist, nanoid,
#     source-map-js, baseline-browser-mapping. Dev-only and never bundled, but
#     every one has a released fix, so they went into the tooling bump instead.
#   * 15 dev-only Python (pip, pyasn1, opentelemetry-api) — never in an installer.
#
# The 22 entries below are what genuinely cannot be fixed today:
#   20 not reachable from this codebase, 2 xlsx (reachable, no npm release).

# ---------------------------------------------------------------------------
# zip 4.x — major bump (9.0.5) owned by tauri-plugin-updater, not by us.
# ---------------------------------------------------------------------------
# The only consumer is tauri-plugin-updater, which unpacks an update archive
# only AFTER minisign signature verification. Every one of these advisories
# needs a crafted ZIP to reach the extraction code, i.e. it needs the update
# signing key. Revisit when tauri-plugin-updater adopts zip 9.

[[IgnoredVulns]]
id = "GHSA-m665-v7pm-7grj"
effectiveUntil = 2027-03-01
reason = "zip 4.x dual-header parser differential. Only extraction path in this repo is tauri-plugin-updater, which unpacks signed update archives after minisign verification. Fix requires zip 9.x, a major owned by the plugin."

[[IgnoredVulns]]
id = "GHSA-q7v9-x93c-xqv3"
effectiveUntil = 2027-03-01
reason = "zip symlink-target handling. Same upstream constraint: only reachable via the signed update archive, fix is major zip 9.0.0."

[[IgnoredVulns]]
id = "GHSA-8hxf-qr8p-62x4"
effectiveUntil = 2027-03-01
reason = "zip AES HMAC bypass on premature EOF. Signed-archive-only path; fix is major zip 9.0.0."

[[IgnoredVulns]]
