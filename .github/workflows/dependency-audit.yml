# Dependency audit — advisory tracking for the four dependency sources.
#
# Why a separate workflow: the audit that produced osv-scanner.toml (2026-11-08)
# found 94 advisories, of which only a handful are worth acting on. The point of
# this job is to keep that from being re-discovered by hand every quarter, and to
# stop NEW vulnerable dependencies from landing without anyone noticing.
#
# Three modes, and the split between them is the point:
#   * pull_request — scans the base branch and the PR head, fails ONLY on
#     vulnerabilities the PR adds.
#   * push — same idea, but blocked against the commit being pushed from
#     (`github.event.before`) instead of the base branch. Implemented in
#     scripts/osv_delta.py; see the note below on why this is not a full scan.
#     It still publishes the pushed tree's FULL results to code scanning, because
#     code scanning replaces a ref's alert set wholesale: a job that only had the
#     delta to upload would close the backlog alerts it was not asked about.
#   * schedule / workflow_dispatch — full backlog scan, reported to the Security
#     tab. Blocking: fail-on-vuln: true.
#
# Why push stopped being a full scan (2026-11-17). It went red twice in one day on
# commits that had nothing to do with the finding, which is how a gate gets
# ignored:
#
#   * RUSTSEC-2026-0543 (chrono, unmaintained). OSV re-published the record at
#     10:15Z. The last green audit was 05:31Z (79f3a37, #32) and chrono was
#     already in the lockfile then; the red runs (#36 at 12:12Z, #37 at 12:15Z)
#     touched a CI matrix and a Node version.
#   * GHSA-fc5q-39xc-vjpf (picomatch). The advisory became github_reviewed at
#     15:56Z. `surfaces/gui/package-lock.json` was on exactly the same three
#     picomatch versions (4.0.4, 4.0.7, 4.0.7) at the last green run and at the
#     red one; #40 changed two cargo command lines.
#
# Both findings are real and both were handled (a dated acceptance each, after
# checking there is no released fix to upgrade to -- picomatch 4.0.7 IS the newest
# published version). Neither is a thing the pushing author changed. So the push
# gate now asks the only question an author can act on: did MY commit introduce
# this? Advisory drift against unchanged code still blocks, but on the scheduled
# run, once a week, for whoever is on audit duty -- not on a random docs commit.
#
#     What "drained" means here, measured rather than assumed. On the parent
#     commit (rustix 1.1.4) the scan reports 21 rows across 13 packages; the
#     accept-list covers 20 of them and RUSTSEC-2026-0486 is the one gap, which is
#     exactly why this commit is stacked on the rustix upgrade. After that bump:
#     20 rows across 12 packages, all accepted, 0 reported-but-unaccepted and 0
#     accepted-but-unmatched.
#
#     Counting convention matters when quoting this, so: osv-scanner's table
#     summary says "13 packages affected by 19 known vulnerabilities" for the
#     same tree where --format=json returns 21 entries. The table collapses
#     aliases (the zip pair GHSA-q7v9-x93c-xqv3 / RUSTSEC-2026-0429 counts once);
#     the JSON counts one entry per listed row. The 21 / 20 figures here are the
#     JSON convention, because that is what the accept-list rows are matched
#     against.
#
#     The scanner prints "unused ignores" for 2 rows, and that warning is worth
#     understanding before anyone treats it as a hole: either ID of an alias pair
#     suppresses BOTH listings (tested: a config with only RUSTSEC-2026-0429 also
#     removes the GHSA-q7v9 listing, and vice versa), so the second row of each
#     pair is redundant rather than missing. Harmless, but the two extra rows can
#     be deleted to silence the warning.
#
#     The one finding that was NOT accepted: RUSTSEC-2026-0486 on rustix 1.1.4.
#     It landed after the 2026-11-08 audit and has a released patch, so it was
#     upgraded (rustix 1.1.6 + xattr 1.7.0) instead of accepted. This branch is
#     stacked on that upgrade and cannot go green without it -- merging the flag
#     flip alone turns the first scheduled run red.
#
#     Two things about the accept-list that justify making the job blocking:
#     it only holds unfixable debt (every real fix in it is a major owned by an
#     upstream), and every row is dated. The expiry is checked, not assumed: a
#     row dated in the past makes its finding reappear and the scan exit 1, so a
#     lapsed acceptance turns this job red rather than rotting quietly.
#
# Note on rustix/xattr pairing, for whoever bumps these next: rustix 1.1.6 changed
# what a zero-length xattr buffer means -- it used to ask the OS for the size, now
# it returns nothing and the size comes from the new *_query functions. xattr
# 1.6.1 does its size query with the old idiom (&mut []), so 1.6.1 + rustix 1.1.6
# compiles and then reads any attribute over 4 KiB as empty. xattr 1.7.0 declares
# rustix 1.1.6 and calls the *_query functions. Bump them together; nothing at
# build time catches the bad pairing.
#
# Coverage note: the scan covers surfaces/gui/package-lock.json (565 packages),
# stt/Cargo.lock (173), surfaces/gui/src-tauri/Cargo.lock (558) and uv.lock (127,
# as enumerated by osv-scanner --all-packages). Python IS covered, through
# uv.lock. Two caveats on that,
# neither of which this job can detect: the lock includes dev and optional
# extras, so it overstates what ships; and CI installs requirements-dev.lock,
# which is `uv export`ed from uv.lock by hand, so a lock that drifts from that
# export is scanned but not installed from. The floors in pyproject.toml
# (e.g. pypdf>=6.21.4) remain the review-time control for the latter.

name: Dependency audit

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write   # upload SARIF to the Security > Code scanning tab

jobs:
  new-vulnerabilities:
    if: github.event_name == 'pull_request'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    with:
      # --config is explicit because osv-scanner.toml does not propagate into
      # subdirectories, and every lockfile here lives below the repo root.
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./

  push-delta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be in the local object database to check out.
          fetch-depth: 0

      # Scan the tree being pushed FROM, then the tree being pushed TO, with the
      # same scanner and the same OSV data. Scanning both sides live is what makes
      # a freshly published advisory cancel out instead of turning the push red:
      # if OSV learned something new today, both scans see it. Committing a
      # baseline file instead would go stale exactly when OSV moves, which is the
      # bug this job exists to remove. Keep this shape in sync with
      # osv-scanner-reusable-pr.yml, which does the same two-scan dance.
      - name: "Check out the commit being pushed from"
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::No base commit in the push event, so there is nothing to diff against."
            echo "This happens on the first push to a new branch. Re-run the workflow manually"
            echo "(workflow_dispatch) for a full backlog scan instead."
            exit 1
          fi
          git checkout -f "$BASE_SHA"
          echo "Base tree: $(git rev-parse --short HEAD)"

      - name: "Scan the base tree"
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5 # v2.7.1
        # Exits non-zero both for "found vulnerabilities" and for "the scan broke",
        # so the outcome cannot be interpreted here. scripts/osv_delta.py refuses to
        # read a missing or malformed result file as "no new findings".
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=base-results.json
            --config=osv-scanner.toml
            --recursive
            ./

      - name: "Check out the pushed tree"
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout -f "$HEAD_SHA"
          echo "Head tree: $(git rev-parse --short HEAD)"

      - name: "Scan the pushed tree"
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=head-results.json
            --config=osv-scanner.toml
            --recursive
            ./

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The script is stdlib-only on purpose: no install step, nothing for a
      # compromised registry to serve. It exits 1 on a finding the base tree did
      # not have, and 2 when either scan result is unusable.
      - name: "Block only on findings this push introduces"
        run: python scripts/osv_delta.py --base base-results.json --head head-results.json

  # Code scanning is a second consumer, separate from the gate above, and it needs
  # the pushed TREE's whole result set -- not the delta.
  #
  # Why this is a separate job calling the official reusable workflow rather than
  # four more steps inside push-delta: code scanning replaces a ref's alert set
  # wholesale on each upload. Uploading only the delta would tell it that every
  # backlog finding this push did not introduce had been fixed, and it would close
  # those alerts. Hand-rolling the SARIF was the other option and was rejected --
  # osv-scanner can emit --format=sarif natively, but its rule ids would not match
  # the reporter-generated SARIF that pull_request and full-backlog upload, and the
  # existing alerts would be re-opened under new ids. The reusable workflow keeps
  # the ids identical across all three triggers.
  #
  # Deliberately NOT gating: fail-on-vuln is false. Blocking is push-delta's job,
  # and failing here would re-block the push on exactly the backlog findings that
  # the delta split exists to leave alone.
  code-scanning:
    if: github.event_name == 'push'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
      fail-on-vuln: false
      upload-sarif: true

  full-backlog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
      # Blocking, and this is the job that catches advisory drift: a finding
      # published against code nobody touched shows up here. It runs on a schedule
      # precisely so that a red run arrives on audit day, not attached to whatever
      # commit happened to be in flight. Every accepted entry is expiry-dated, so a
      # stale acceptance turns this job red instead of rotting quietly.
      fail-on-vuln: true
