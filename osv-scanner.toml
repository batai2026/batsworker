# OSV-Scanner suppressions — accepted dependency risk, with deadlines.
#
# POLICY
#   * Only genuinely UNFIXABLE advisories belong in this file. Anything with a
#     released fix gets upgraded, not listed here.
#   * Every entry carries an `effectiveUntil` date. When it passes, the finding
#     reappears in CI: the acceptance is debt with a due date, not silence.
#     KEY NAME: osv-scanner v2 accepts `effectiveUntil` on [[IgnoredVulns]] — since
#     2.7.1, which still honours `ignoreUntil` as a fallback. `ignoreUntil` is the
#     deprecated spelling and 2.7.1 warns on every scan:
#         warning: osv-scanner.toml has at least one ignore entry using
#         'ignoreUntil' which has been deprecated in favor of 'effectiveUntil'
#     This file used `ignoreUntil` until 2026-11-16; migrated to `effectiveUntil`
#     because 2.7.0 does NOT know that key. VERSION COUPLING: the scanner that
#     reads this file must be >= 2.7.1. Under 2.7.0, `effectiveUntil` is an unknown
#     key, the loader rejects the whole file ("unknown keys in config file") and
#     the scan exits 127 — every acceptance silently stops applying. That is why
#     .github/workflows/dependency-audit.yml pins osv-scanner-action v2.7.1
#     (32d3cd48) in the same commit; do not downgrade one without the other.
#     The loader IS strict about unknown keys, but only for a key it does not
#     recognise at all. Both spellings above are recognised by 2.7.1; a typo is not.
#   * ONE entry per advisory. osv-scanner emits one record per OSV id and
#     expands suppression through `aliases`, so listing both the GHSA and the
#     RUSTSEC id of a single advisory silences it twice and makes the second
#     entry report as an "unused ignore". Entries below use the id the scanner
#     actually emits, once each.
#   * Every entry explains WHY it is safe here — the code path, not the CVSS.
#
# This file is passed explicitly (`--config=osv-scanner.toml`) because
# osv-scanner.toml does not propagate into subdirectories, and our lockfiles
# live in surfaces/gui/ and stt/.
#
# Audit that produced this list: 2026-11-08 (94 unique advisories over 4 lockfile
# sources). Re-measured 2026-11-09 against the tree with every fix applied: 18
# distinct advisories remained, and they are the 18 entries below.
#
# Counting note: this file previously held 20 entries for those 18 advisories —
# GHSA-q7v9-x93c-xqv3 also appeared as RUSTSEC-2026-0429, and
# GHSA-wrw7-89jp-8q8g also appeared as RUSTSEC-2024-0429. Since suppression
# expands through aliases, each duplicate silenced an advisory that an earlier
# entry already covered, and osv-scanner flagged both as "unused ignores".
# They were removed on 2026-11-16 after verifying the remaining 18 still suppress
# every record the lockfiles produce.
#
# The other 74 are absent because they were FIXED, not suppressed (all on
# 2026-11-09, each suite green):
#   * 35 PyPI - pypdf 18 and certifi 2 are reachable and were closed by raising the
#     floors in requirements.txt; pip 10, pyasn1 4 and opentelemetry-api 1 are
#     dev-only and never enter an installer.
#   * 25 npm - 23 dev-toolchain advisories (vite, vitest, @vitest/mocker, tinypool,
#     esbuild, postcss, postcss-selector-parser, browserslist, nanoid,
#     source-map-js, baseline-browser-mapping) went into the tooling bump, and 2
#     reachable xlsx advisories were closed by replacing SheetJS with exceljs.
#     exceljs's own uuid arrived flagged (GHSA-w5hq-g745-h8pq) and is lifted to
#     11.1.1 by the `overrides` block in surfaces/gui/package.json, so it never
#     reaches this file either.
#   * 14 crates.io - the rustls/webpki TLS stack 11 (reachable), plus tokio, anyhow
#     and event-listener 3 that fell out of the same Rust bump.
#
# The 18 entries below are what cannot be fixed by a version bump today. None of
# them is reachable from this codebase: each is an unmaintained-crate notice, an
# advisory in a crate pulled in only by such a crate, or the zip 4.x family behind
# tauri-plugin-updater's minisign check.
#
# Two entries are NOT covered by that sentence and are tracked as debt rather than
# settled: RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (quick-xml). Both have a
# released fix (0.41.0), so the policy above says they should be upgraded, not
# accepted. They stay here only because the bump is a breaking 0.x change INSIDE
# Tauri's own dependency tree. That is a cost calculation, not the "unfixable"
# claim the policy asks for, and the reasons below say so explicitly.
#
# ---------------------------------------------------------------------------
# zip 4.x — major bump (9.0.5) owned by tauri-plugin-updater, not by us.
# ---------------------------------------------------------------------------
# The only consumer is tauri-plugin-updater, which unpacks an update archive
# only AFTER minisign signature verification. Every one of these advisories
# needs a crafted ZIP to reach the extraction code, i.e. it needs the update
# signing key. Revisit when tauri-plugin-updater adopts zip 9.

[[IgnoredVulns]]
id = "GHSA-m665-v7pm-7grj"
effectiveUntil = 2027-03-01
reason = "zip 4.x dual-header parser differential. Only extraction path in this repo is tauri-plugin-updater, which unpacks signed update archives after minisign verification. Fix requires zip 9.x, a major owned by the plugin."

[[IgnoredVulns]]
