# OSV-Scanner suppressions — accepted dependency risk, with deadlines.
#
# POLICY
#   * Only genuinely UNFIXABLE advisories belong in this file. Anything with a
#     released fix gets upgraded, not listed here.
#   * Every entry carries an `effectiveUntil` date. When it passes, the finding
#     reappears in CI: the acceptance is debt with a due date, not silence.
#     KEY NAME: osv-scanner v2 accepts `effectiveUntil` on [[IgnoredVulns]] — since
#     2.7.1, which still honours `ignoreUntil` as a fallback. `ignoreUntil` is the
#     deprecated spelling and 2.7.1 warns on every scan:
#         warning: osv-scanner.toml has at least one ignore entry using
#         'ignoreUntil' which has been deprecated in favor of 'effectiveUntil'
#     This file used `ignoreUntil` until 2026-11-16; migrated to `effectiveUntil`
#     because 2.7.0 does NOT know that key. VERSION COUPLING: the scanner that
#     reads this file must be >= 2.7.1. Under 2.7.0, `effectiveUntil` is an unknown
#     key, the loader rejects the whole file ("unknown keys in config file") and
#     the scan exits 127 — every acceptance silently stops applying. That is why
#     .github/workflows/dependency-audit.yml pins osv-scanner-action v2.7.1
#     (32d3cd48) in the same commit; do not downgrade one without the other.
#     The loader IS strict about unknown keys, but only for a key it does not
#     recognise at all. Both spellings above are recognised by 2.7.1; a typo is not.
#   * ONE entry per advisory. osv-scanner emits one record per OSV id and
#     expands suppression through `aliases`, so listing both the GHSA and the
#     RUSTSEC id of a single advisory silences it twice and makes the second
#     entry report as an "unused ignore". Entries below use the id the scanner
#     actually emits, once each.
#   * Every entry explains WHY it is safe here — the code path, not the CVSS.
#
# This file is passed explicitly (`--config=osv-scanner.toml`) because
# osv-scanner.toml does not propagate into subdirectories, and our lockfiles
# live in surfaces/gui/ and stt/.
#
# ---------------------------------------------------------------------------
# AUDIT 2026-11-18 (second pass) — 20 entries in, 7 out. 13 deleted.
#
# The previous header claimed "18 entries ... cannot be fixed by a version bump"
# and "none of them is reachable from this codebase". Both were wrong. This pass
# re-derived every row from the RustSec advisory files and the versions the two
# lockfiles actually pin (surfaces/gui/src-tauri/Cargo.lock, stt/Cargo.lock):
# 13 of the 20 were suppressing nothing and are deleted.
#
#   * 6 zip rows (GHSA-m665-v7pm-7grj, GHSA-q7v9-x93c-xqv3, GHSA-8hxf-qr8p-62x4,
#     RUSTSEC-2026-0367/0368/0369). Each said "the fix needs zip 9.x, a major owned
#     by the plugin". The plugin moved: tauri-plugin-updater 2.14.1 enables its
#     `zip` feature and the lock pins zip 9.6.0, at or past `patched >= 9.0.0`
#     (and >= 9.0.5 for m665). They described a state that no longer exists.
#     NOTE this one IS a live code path — the updater decompresses update packages
#     on Windows (`zip` edge is target=cfg(target_os="windows")) — it is just
#     already fixed. Deleting the suppression is what makes CI say so.
#   * 5 unic-* rows (RUSTSEC-2025-0075/0080/0081/0098/0100). Each said "transitive
#     via idna". idna is 1.1.0 now and no longer pulls them: `unic-` occurs zero
#     times in either lockfile, the Windows resolve graph has none of the five, and
#     `cargo tree -i unic-char-range` fails with "did not match any packages".
#     The `.fingerprint` dirs for them are leftovers from 2026-11-14, before the
#     bump — stale build output, not evidence they still build.
#   * 2 quick-xml rows (RUSTSEC-2026-0194/0195). These were the only ones this
#     file's policy condemned outright. They said a fix meant "a breaking 0.x bump
#     inside Tauri's tree"; in fact quick-xml's ONLY parent is plist, and plist
#     1.10.4 requires quick-xml ^0.42.0. Bumping plist 1.9.0 -> 1.10.4 (PR #48)
#     moves quick-xml 0.39.4 -> 0.42.0, past `patched >= 0.41.0`. THIS DELETE IS
#     ONLY TRUE ONCE #48 IS ON main — if #48 is reverted, these two must come back.
#
# HOW "compiled" WAS DETERMINED. The resolve graph in `cargo metadata` lists
# optional edges that were never enabled, so it cannot answer "does this ship".
# Build artefacts can: cargo writes a fingerprint dir and an rlib per crate it
# compiles. Filtering the graph to the platform we ship
# (`--filter-platform x86_64-pc-windows-msvc`, 320 packages) and checking
# target/debug/.fingerprint: plist, quick-xml, zip, serde_with, idna and
# tauri-plugin-updater are COMPILED; chrono, glib, gtk, zbus, zvariant,
# zbus_names, zvariant_derive and proc-macro-error have no fingerprint and no
# rlib. chrono is listed as a package only because serde_with declares it
# optionally; serde_with's enabled features here are {alloc, default, macros,
# std}, with no chrono_0_4.
#
# PLATFORMS WE SHIP. .github/workflows/release.yml builds macos-latest,
# macos-15-intel and windows-latest. There is no Linux artefact. So a crate that
# only exists behind Tauri's GTK/D-Bus layer is never linked into anything a user
# installs, even though the Linux CI job does compile it.
#
# The 7 that remain are all "no fixed version exists" (5 unmaintained notices and
# 2 crates whose fix is not published yet) — not "too expensive to fix".
# ---------------------------------------------------------------------------

# --- not compiled into any released artefact ---

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
# RUSTSEC-2024-0429. Kept: there is no version of this to upgrade to.
# glib 0.18.5 is what gtk 0.18.2 requires (^0.18); the advisory is patched at
# >= 0.20.0. gtk 0.19.0 already wants glib ^0.22, but tauri 2.12.5 — and even
# the newest published tauri, 2.12.6 — still declares gtk ^0.18, so the gtk-rs
# move has to happen upstream first. Reached only through Tauri's GTK layer, and
# release.yml ships macOS + Windows only, so it is in no released binary.
# The unsoundness is VariantStrIter; nothing in this codebase constructs one.
effectiveUntil = 2027-03-01
reason = "glib VariantStrIter unsoundness, patched only at glib >= 0.20.0. gtk 0.18.2 pins glib ^0.18 and tauri still requires gtk ^0.18 (checked tauri 2.12.6, the newest published release), so no legal upgrade exists from here — the fix is gtk-rs releasing a tauri-consumable gtk 0.19+. Linux GTK layer only; release.yml builds macOS arm64/x64 and Windows, so it is not in any shipped artefact, and this codebase never constructs a VariantStrIter."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
effectiveUntil = 2027-08-01
reason = "proc-macro-error 1.0.4 is unmaintained. Build-time only and not built for Windows: its only edges are glib-macros 0.18.5 and gtk3-macros 0.18.2, both behind Tauri's Linux GTK layer, and neither is in the windows fingerprint set. No fixed version exists; removal requires gtk-rs to drop it."

