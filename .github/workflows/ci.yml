# App CI — the coworker Python suite, the desktop shell and STT sidecar (Rust),
# the GUI unit tests, and the hermetic Playwright e2e suite (mocked /v1 + WS; no
# model or network needed).

name: CI

on: [push, pull_request]

# Read-only token: CI runs third-party install code (`pip install -e .[dev]`,
# `npm ci` postinstall scripts), none of which should be able to write to the
# repository. An unset block inherits the repository default instead.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.17.3"
      - name: Ruff
        run: ruff check coworker tests scripts

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev,bedrock]"
      - name: Test
        run: pytest tests -q --cov --cov-report=term

  # Windows: catch platform-only failures (time.tzset, UTF-8 decoding, PowerShell
  # shell semantics) that the Linux CI can never see. The two known Windows failures
  # were fixed in tests; keep this job blocking so they stay fixed.
  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev,bedrock]"
      - name: Test
        shell: pwsh
        run: pytest tests -q --cov --cov-report=term

  # The image layout is a security boundary: a state dir inside /workspace hands the model
  # `secrets.json` and the sidecar token via unapproved `read_file`, and uid 0 turns a
  # tool-execution escape into host privilege. Nothing else builds the image -- docker.yml
  # runs on tags only -- so an unsafe Dockerfile could reach GHCR unexercised. Build it on
  # every PR and assert the boundary from inside the container.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t openworker:ci .
      - name: Container isolation self-check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scripts/check_container_state_isolation.py:/check/check.py:ro" \
            --entrypoint python \
            openworker:ci /check/check.py

  gui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: i18n key check
        run: python3 surfaces/gui/scripts/check_i18n.py
      - name: Typecheck
        working-directory: surfaces/gui
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: surfaces/gui
        run: npm test

  gui-unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        shell: pwsh
        run: npm ci
      - name: i18n key check
        shell: pwsh
        run: python surfaces/gui/scripts/check_i18n.py
      - name: Typecheck
        working-directory: surfaces/gui
        shell: pwsh
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: surfaces/gui
        shell: pwsh
        run: npm test

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Install Playwright browsers
        working-directory: surfaces/gui
        # No `--with-deps`: that flag shells out to apt-get, and a DNS hiccup on the
        # runner ("Temporary failure resolving azure.archive.ubuntu.com") burned 10
        # minutes and turned the job red while every other job passed. The image
        # already carries Chromium's shared libraries; if it ever stops doing so,
        # Playwright names the missing package and it goes back in as an explicit
        # `apt-get install` line rather than a blanket dependency sweep.
        run: npx playwright install chromium
      - name: e2e
        working-directory: surfaces/gui
        run: npm run e2e

  # Rust: neither the desktop shell nor `stt/` had any CI coverage, so two classes
  # of breakage could only be found by a human running cargo locally -- a
  # feature/config mismatch (e.g. `protocol-asset` without `assetProtocol`, which
  # tauri-build rejects) and a type error inside a `#[cfg(windows)]` block, which
  # no other job compiles.
  #
  # The SPA is bundled as a resource, and tauri-build hard-fails when `../dist` is
  # missing, so the frontend is built first. That also lets the last step assert
  # the copied layout: a `dist/**/*` resource glob flattens `assets/` into the
  # dist root, which leaves index.html pointing at files that are not there.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: Build the SPA that gets bundled
        working-directory: surfaces/gui
        shell: pwsh
        run: |
          npm ci
          npm run build
      # Pinned like release.yml: third-party actions by commit, GitHub-owned by tag.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            surfaces/gui/src-tauri
            stt
      - name: Locate libclang (whisper-rs bindgen)
        # windows-latest usually ships LLVM already; install only when it is absent
        # so the job does not depend on an image detail that can change.
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvm "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Clippy
        working-directory: surfaces/gui/src-tauri
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings
      - name: Assert the bundled SPA keeps its layout
        shell: bash
        run: |
          test -f surfaces/gui/src-tauri/target/debug/dist/index.html
          test -d surfaces/gui/src-tauri/target/debug/dist/assets
      - name: Test the STT sidecar
        shell: pwsh
        run: cargo test --manifest-path stt/Cargo.toml
